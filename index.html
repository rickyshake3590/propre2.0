<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ProPre2.0 — Timer Dashboard</title>
<style>
  @font-face {
    font-family: 'Big Noodle Tilting';
    src: url('fonts/big_noodle_titling.ttf') format('truetype');
    font-display: swap;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  button, input, select, textarea { font-family: inherit; }

  :root {
    --bg: #0a0a0a;
    --panel: #131313;
    --panel-border: #262626;
    --card-bg: #1b1b1b;
    --card-border: #333;
    --text: #eaeaea;
    --text-dim: #8a8a8a;
    --accent: #FFD700;
    --select-orange: #FF8C00;
    --run-green: #4ADE80;
    --run-yellow: #FDE047;
    --run-red: #F87171;
    --run-text-dark: #14231a;
    font-family: Helvetica, Arial, sans-serif;
  }

  body {
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    padding: 14px 24px;
    border-bottom: 1px solid var(--panel-border);
    display: flex;
    align-items: baseline;
    gap: 12px;
    flex-shrink: 0;
  }
  header h1 { font-size: 22px; letter-spacing: 2px; color: var(--accent); }
  header span { font-size: 12px; color: var(--text-dim); letter-spacing: 1px; }
  header .mirror-info { margin-left: auto; font-size: 11px; color: var(--text-dim); text-align: right; user-select: text; }
  header .mirror-info b { color: var(--text); font-weight: normal; }

  .app-layout {
    flex: 1;
    display: grid;
    grid-template-columns: 300px 1fr 360px;
    min-height: 0;
  }

  @media (max-width: 1000px) {
    .app-layout { grid-template-columns: 1fr; }
    .left-panel, .middle-panel, .right-panel { border-right: none !important; border-bottom: 1px solid var(--panel-border); }
  }

  .panel-title {
    font-size: 13px;
    letter-spacing: 1.5px;
    color: var(--text-dim);
    margin-bottom: 10px;
    text-transform: uppercase;
  }

  /* ===== LEFT PANEL — Create Timer ===== */
  .left-panel {
    background: var(--panel);
    border-right: 1px solid var(--panel-border);
    padding: 18px;
    overflow-y: auto;
  }

  .create-form {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 6px;
    padding: 14px;
  }

  .field { margin-bottom: 10px; }
  .field label {
    display: block;
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 1px;
    margin-bottom: 4px;
    text-transform: uppercase;
  }
  .field input, .field select {
    width: 100%;
    background: #0d0d0d;
    border: 1px solid var(--card-border);
    color: var(--text);
    padding: 8px 10px;
    border-radius: 4px;
    font-size: 14px;
    font-family: inherit;
  }
  .field input:focus, .field select:focus { outline: none; border-color: var(--accent); }
  .field.is-disabled label, .field.is-disabled input { opacity: 0.35; cursor: not-allowed; }
  .field.is-disabled input { background: #111; }

  .btn {
    cursor: pointer;
    border: none;
    border-radius: 4px;
    padding: 9px 14px;
    font-size: 13px;
    letter-spacing: 1px;
    font-family: inherit;
    text-transform: uppercase;
  }
  .btn-primary { background: var(--accent); color: #0a0a0a; font-weight: bold; width: 100%; margin-top: 4px; }
  .btn-primary:hover { background: #ffe14d; }
  .btn-secondary { background: #2a2a2a; color: var(--text); }
  .btn-secondary:hover { background: #383838; }
  .btn:disabled { opacity: 0.35; cursor: not-allowed; }

  .form-error { color: #e07070; font-size: 12px; margin-top: 6px; display: none; }

  /* ===== MIDDLE PANEL — Template Grid (ProPresenter-style) ===== */
  .middle-panel {
    background: #0d0d0d;
    border-right: 1px solid var(--panel-border);
    padding: 18px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
  }

  .middle-panel { container-type: inline-size; }
  #preview-list {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    align-content: start;
    overflow-y: auto;
    scrollbar-gutter: stable;
    padding: 4px;
    /* 4 rows x card height, plus 12px gaps and 4px padding top/bottom */
    max-height: calc(4 * ((((100cqw - 32px) / 3) - 4px) * 9 / 16 + 28px) + 3 * 12px + 8px);
  }
  @media (max-width: 700px) {
    #preview-list { grid-template-columns: repeat(2, 1fr); }
  }

  .empty-state { color: var(--text-dim); font-size: 13px; text-align: center; padding: 40px 0; grid-column: 1 / -1; }

  /* ===== Timer scene — one component used by the form preview, the preview grid and the live box.
     All text is sized in container-query units so it keeps its ratio to the box at any size. ===== */
  .scene {
    width: 100%;
    aspect-ratio: 16 / 9; /* same shape as the ProPresenter slide, so text:box ratios match the reference */
    container-type: size;
    background: var(--card-bg);
    border: 2px solid var(--card-border);
    border-radius: 8px;
    overflow: hidden;
    font-family: Helvetica, Arial, sans-serif;
  }
  .scene-inner { height: 100%; padding: 0; display: flex; flex-direction: column; }
  .scene-name, .scene-clock { line-height: 0.85; white-space: nowrap; }
  .scene-name { color: #fff; margin-bottom: 1cqh; font-weight: 700; }
  .scene-clock { color: var(--text-dim); margin-top: 1cqh; font-variant-numeric: tabular-nums; font-family: 'Big Noodle Tilting', monospace; }
  .scene-value { line-height: 0.85; font-variant-numeric: tabular-nums; white-space: nowrap; font-family: 'Big Noodle Tilting', monospace; }
  .scene.size-extra-small .scene-value { font-size: 18cqh; }
  .scene.size-extra-small .scene-name { font-size: 5.25cqh; }
  .scene.size-extra-small .scene-clock { font-size: 8.25cqh; }
  .scene.size-small .scene-value { font-size: 24cqh; }
  .scene.size-medium .scene-value { font-size: 52cqh; }
  .scene.size-large .scene-value { font-size: 72cqh; }
  .scene.size-small .scene-name { font-size: 7cqh; }
  .scene.size-small .scene-clock { font-size: 11cqh; }
  .scene.size-medium .scene-name { font-size: 9cqh; }
  .scene.size-medium .scene-clock { font-size: 16cqh; }
  .scene.size-large .scene-name { font-size: 11cqh; }
  .scene.size-large .scene-clock { font-size: 20cqh; }

  .preview-card {
    cursor: pointer;
    border: 2px solid var(--card-border);
    border-radius: 8px;
    overflow: hidden;
    background: #3a3a3a;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .preview-card {
    display: flex;
    flex-direction: column;
    height: calc((((100cqw - 32px) / 3) - 4px) * 9 / 16 + 28px);
  }
  .preview-card .scene { border: 0; border-radius: 0; aspect-ratio: auto; flex: 1 1 auto; min-height: 0; }
  /* Grey strip under the timer box with the timer name at the bottom right (ProPresenter-style) */
  .preview-footer {
    background: #4a4a4a;
    color: #fff;
    font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif;
    font-size: 12px;
    line-height: 1;
    text-align: right;
    padding: 6px 10px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .preview-card:hover { border-color: #555; }
  .preview-card.selected { border-color: var(--select-orange); box-shadow: 0 0 0 3px rgba(255,140,0,0.22); }
  /* Running: whole outline turns green (overrides the orange selection outline) until paused/ended */
  .preview-card.running, .preview-card.running.selected { border-color: var(--run-green); }
  .preview-card.running.selected { box-shadow: 0 0 0 3px rgba(74,222,128,0.22); }

  /* ===== RIGHT PANEL — Live + Controls ===== */
  .right-panel { display: flex; flex-direction: column; min-height: 0; overflow: hidden; }

  .live-output-box {
    position: relative;
    flex-shrink: 0;
    background: #000;
    border-bottom: 2px solid var(--accent);
    padding: 16px;
  }
  .live-output-box .live-placeholder { color: var(--text-dim); font-size: 16px; text-align: center; padding: 60px 0; }

  .control-list { flex: 1; overflow-y: auto; padding: 14px 18px; display: flex; flex-direction: column; gap: 10px; }
  .control-list .panel-title { padding: 0 0 2px 0; }
  #control-rows { overflow-y: auto; scrollbar-gutter: stable; padding: 4px; }

  .control-row {
    --bar: transparent;
    background: var(--card-bg);
    border: 2px solid var(--card-border);
    border-left: 5px solid var(--bar);
    border-radius: 8px;
    padding: 10px 12px;
    display: flex;
    align-items: flex-start;
    gap: 10px;
    transition: border-color 0.15s;
  }
  .control-row.selected { border-color: var(--select-orange); box-shadow: 0 0 0 3px rgba(255,140,0,0.22); }
  /* Running: whole outline turns green (overrides the orange selection outline) until paused/ended */
  .control-row.running, .control-row.running.selected { border-color: var(--run-green); }
  .control-row.running.selected { box-shadow: 0 0 0 3px rgba(74,222,128,0.22); }

  .control-row .row-info { flex: 1; min-width: 0; cursor: pointer; }
  .drag-handle { flex-shrink: 0; align-self: center; width: 12px; color: #5a5a5a; cursor: grab; display: flex; justify-content: center; }
  .drag-handle:hover { color: var(--text); }
  .drag-handle:active { cursor: grabbing; }
  .drag-handle svg { width: 10px; height: 16px; fill: currentColor; }
  .control-row.dragging { opacity: 0.4; }
  .control-row.drop-target { outline: 2px dashed var(--accent); outline-offset: 3px; }
  .preview-card.dragging { opacity: 0.4; }
  .preview-card.drop-target { outline: 2px dashed var(--accent); outline-offset: 1px; }
  .preview-card { cursor: grab; }
  .preview-card:active { cursor: grabbing; }
  .move-col { flex-shrink: 0; align-self: center; display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .move-btn { width: 18px; height: 16px; background: none; border: none; color: #5a5a5a; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0; }
  .move-btn:hover:not(:disabled) { color: var(--text); }
  .move-btn:disabled { opacity: 0.2; cursor: default; }
  .move-btn svg { width: 12px; height: 12px; }
  .control-row .row-name { font-size: 11px; color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .control-row .row-state { font-size: 13px; color: var(--text-dim); }
  .control-row.running .row-state { color: var(--run-green); }
  .control-row.running.warn .row-state { color: var(--run-yellow); }
  .control-row.running.crit .row-state { color: var(--run-red); }
  .control-row .row-time { font-family: 'Big Noodle Tilting', monospace; font-size: 26px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; line-height: 1.15; }
  .control-row .row-time.editable { cursor: text; border-radius: 4px; width: fit-content; padding: 0 4px; margin-left: -4px; border-bottom: 1px dashed #444; }
  .control-row .row-time.editable:hover { background: #262626; border-bottom-color: var(--accent); }
  .row-time-input {
    width: 100%; max-width: 150px; font-family: 'Big Noodle Tilting', monospace; font-size: 26px; font-weight: 700; line-height: 1.15;
    font-variant-numeric: tabular-nums; color: var(--text); background: #0d0d0d;
    border: 1px solid var(--accent); border-radius: 4px; padding: 0 6px; outline: none;
  }
  .row-time-input.invalid { border-color: var(--run-red); }
  /* Timer name: click to edit in place (preview footer and control row) */
  .editable-name { cursor: text; border-bottom: 1px dashed transparent; }
  .editable-name:hover { border-bottom-color: #777; }
  .name-input {
    display: block; width: 100%; box-sizing: border-box; font: inherit; color: #fff; text-align: inherit;
    background: #0d0d0d; border: 1px solid var(--accent); border-radius: 4px; padding: 1px 4px; outline: none;
  }
  /* When the timer shown changes, only the text fades out and back in; the scene outline stays put */
  .live-stage .scene-inner, .live-stage .live-placeholder { transition: opacity 0.25s ease; }
  .live-stage.is-fading .scene-inner, .live-stage.is-fading .live-placeholder { opacity: 0; }
  /* In-app dialog: covers the whole screen and is answered with its buttons (replaces the browser's confirm/alert) */
  .modal-backdrop {
    position: fixed; inset: 0; z-index: 2000;
    background: rgba(0, 0, 0, 0.75);
    display: flex; align-items: center; justify-content: center;
    padding: 16px;
  }
  .modal-box {
    width: min(520px, 100%);
    background: var(--card-bg);
    border: 2px solid var(--accent);
    border-radius: 10px;
    padding: 28px 30px 24px;
    box-shadow: 0 16px 48px rgba(0, 0, 0, 0.7);
  }
  .modal-title { font-size: 18px; letter-spacing: 2px; color: var(--accent); text-transform: uppercase; margin-bottom: 12px; }
  .modal-message { font-size: 17px; line-height: 1.5; color: var(--text); margin-bottom: 26px; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 12px; flex-wrap: wrap; }
  .modal-actions .btn { padding: 12px 20px; font-size: 14px; }
  .modal-actions .btn-danger { background: #b91c1c; color: #fff; }
  .modal-actions .btn-danger:hover { background: #dc2626; }

  /* Right-click menu */
  #ctx-menu {
    position: fixed; z-index: 1000; display: none; min-width: 170px;
    background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 6px;
    padding: 4px; box-shadow: 0 8px 24px rgba(0,0,0,0.6);
  }
  .ctx-item {
    display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 4px;
    font-size: 13px; letter-spacing: 1px; text-transform: uppercase; color: var(--text); cursor: pointer; user-select: none;
  }
  .ctx-item:hover { background: #2a2a2a; color: var(--accent); }
  .ctx-item.ctx-danger { color: #e07070; }
  .ctx-item.ctx-danger:hover { background: #4a1c1c; color: #e07070; }
  .ctx-item svg { width: 14px; height: 14px; }
  .control-row .row-stats { display: flex; gap: 14px; margin-top: 6px; font-size: 10px; color: var(--text-dim); }
  .control-row .row-stats b { display: block; font-weight: normal; color: #6d6d6d; font-variant-numeric: tabular-nums; }
  /* Progress bar: grey track, blue fill for the time that has passed */
  .control-row .row-stats { align-items: center; min-height: 8px; }
  .row-progress { flex: 1 1 auto; height: 8px; background: #3d3d3d; border-radius: 4px; overflow: hidden; }
  .row-progress-fill { height: 100%; width: 0; background: #3b82f6; border-radius: 4px; }

  .row-icons { display: flex; gap: 4px; flex-shrink: 0; }
  .icon-btn {
    width: 32px; height: 32px;
    display: flex; align-items: center; justify-content: center;
    background: #2a2a2a; border: none; border-radius: 50%; color: var(--text);
    cursor: pointer;
  }
  .icon-btn:hover { background: #3a3a3a; }
  .icon-btn.icon-danger { color: #e07070; }
  .icon-btn.icon-danger:hover { background: #4a1c1c; }
  .icon-btn svg { width: 16px; height: 16px; }

  /* ===== BOTTOM ROW: timer log (left column) and timer editor (middle column) ===== */
  .bottom-row {
    flex-shrink: 0;
    display: grid;
    grid-template-columns: 300px 1fr 360px;
    height: 320px;
    border-top: 1px solid var(--panel-border);
    background: var(--panel);
  }
  .timer-log {
    display: flex;
    flex-direction: column;
    min-height: 0;
    border-right: 1px solid var(--panel-border);
  }
  .timer-log-header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 18px; border-bottom: 1px solid var(--panel-border);
  }
  .timer-log-header .panel-title { margin-bottom: 0; }
  .timer-log-entries { flex: 1; min-height: 0; overflow-y: auto; padding: 8px 18px; font-size: 12px; display: flex; flex-direction: column; gap: 4px; }
  .timer-log-entries .log-entry { color: var(--text-dim); }
  .timer-log-entries .log-entry .log-time { color: var(--accent); margin-right: 6px; }
  .timer-log-entries .log-entry .log-name { color: var(--text); font-weight: bold; }

  /* Timer editor: shown in the middle column while a timer is selected */
  .timer-editor {
    background: #0d0d0d;
    border-right: 1px solid var(--panel-border);
    padding: 12px 18px;
    overflow-y: auto;
    min-height: 0;
  }
  .editor-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .editor-head .panel-title { margin: 0; flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .editor-head .btn { padding: 7px 12px; }
  .editor-head .btn-primary { width: auto; margin-top: 0; }
  .editor-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
  .editor-grid .span-2 { grid-column: 1 / -1; }
  .editor-grid .field { margin-bottom: 8px; }
  .editor-grid .check-stack { display: flex; flex-direction: column; gap: 6px; justify-content: center; font-size: 13px; color: var(--text); }
  .editor-grid .check-stack label { display: flex; align-items: center; gap: 8px; cursor: pointer; }
  .editor-grid .check-stack input { width: auto; }
  .editor-empty { text-align: left; padding: 24px 0; }
  .editor-form { padding: 12px 14px 4px; }
  .editor-form.create-form { background: var(--card-bg); }

  @media (max-width: 1000px) {
    .bottom-row { grid-template-columns: 1fr; height: auto; }
    .timer-log { max-height: 240px; border-right: none; border-bottom: 1px solid var(--panel-border); }
    .timer-editor { border-right: none; }
  }
</style>
</head>
<body>

<header>
  <h1>PROPRE2.0</h1>
  <span>TIMER DASHBOARD</span>
  <div class="mirror-info" id="mirror-info"></div>
</header>

<div class="app-layout">

  <!-- LEFT COLUMN — Create Timer -->
  <div class="left-panel">
    <div class="panel-title">Create Timer</div>
    <form class="create-form" id="create-form">
      <div class="field">
        <label>Name</label>
        <input type="text" id="f-name" maxlength="40" required>
      </div>
      <div class="field">
        <label>Duration (MM:SS)</label>
        <input type="text" id="f-duration" placeholder="MM:SS" inputmode="numeric" pattern="\d{1,3}:[0-5]\d" maxlength="6" required>
      </div>
      <div class="field">
        <label>Type</label>
        <select id="f-type">
          <option value="countdown">Countdown</option>
          <option value="countup">Countup</option>
          <option value="altar-call">Altar Call</option>
        </select>
      </div>
      <div class="field">
        <label>Position</label>
        <select id="f-position">
          <option value="top-left">Top Left</option>
          <option value="top-center">Top Center</option>
          <option value="top-right">Top Right</option>
          <option value="middle-left">Middle Left</option>
          <option value="middle-center" selected>Middle Center</option>
          <option value="middle-right">Middle Right</option>
          <option value="bottom-left">Bottom Left</option>
          <option value="bottom-center">Bottom Center</option>
          <option value="bottom-right">Bottom Right</option>
        </select>
      </div>
      <div class="field">
        <label>Size</label>
        <select id="f-size">
          <option value="extra-small">Extra Small</option>
          <option value="small">Small</option>
          <option value="medium">Medium</option>
          <option value="large" selected>Large</option>
        </select>
      </div>
      <div class="field">
        <label>Colour</label>
        <select id="f-colour">
          <option value="white" selected>White</option>
          <option value="yellow">Yellow</option>
          <option value="red">Red</option>
        </select>
      </div>
      <div class="field" style="display:flex; align-items:center; gap:8px; flex-direction:row;">
        <input type="checkbox" id="f-show-title" checked style="width:auto;">
        <label style="margin:0;">Show timer name</label>
      </div>
      <div class="field" style="display:flex; align-items:center; gap:8px; flex-direction:row;">
        <input type="checkbox" id="f-show-current-time" style="width:auto;">
        <label style="margin:0;">Show current time</label>
      </div>
      <div class="form-error" id="create-error"></div>
      <div id="form-preview" style="background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 6px; padding: 12px; margin-bottom: 10px; display: none;"></div>
      <button type="submit" class="btn btn-primary">+ Create</button>
    </form>

    <div class="panel-title" style="margin-top:18px;">Quick Add</div>
    <button type="button" class="btn btn-secondary" id="add-blank-btn" style="width:100%;">+ Add Blank Slide</button>
    <div class="form-error" id="blank-error"></div>
  </div>

  <!-- MIDDLE COLUMN — Previews only -->
  <div class="middle-panel">
    <div class="panel-title">Timer Previews</div>
    <div id="preview-list">
      <div class="empty-state">No timers created yet.</div>
    </div>
  </div>

  <!-- RIGHT COLUMN — Live + Controls -->
  <div class="right-panel">
    <div class="live-output-box" id="live-output-box">
      <div class="live-stage" id="live-stage">
        <div class="live-placeholder" id="live-placeholder">Select or start a timer</div>
        <div id="live-content" style="display:none;"></div>
      </div>
    </div>

    <div class="control-list">
      <div class="panel-title">Timer Controls</div>
      <div id="control-rows">
        <div class="empty-state">No timers yet.</div>
      </div>
    </div>
  </div>

</div>

<!-- BOTTOM ROW — timer log in the left column, timer editor in the middle -->
<div class="bottom-row">
  <div class="timer-log">
    <div class="timer-log-header">
      <div class="panel-title">Timer Log</div>
      <button class="btn btn-secondary" id="clear-log-btn" style="padding:5px 10px; font-size:11px;">Clear</button>
    </div>
    <div class="timer-log-entries" id="log-entries"></div>
  </div>

  <!-- Filled in by renderEditor() when a timer is selected -->
  <div class="timer-editor" id="timer-editor"></div>
</div>

<!-- In-app dialog (see showDialog) -->

<script src="js/store.js"></script>
<script>
const LOG_KEY = 'propre_timer_log';
const ORDER_KEY = 'propre_control_order';
const DRAG_HANDLE = '<svg viewBox="0 0 10 16"><circle cx="2.5" cy="2.5" r="1.5"/><circle cx="7.5" cy="2.5" r="1.5"/><circle cx="2.5" cy="8" r="1.5"/><circle cx="7.5" cy="8" r="1.5"/><circle cx="2.5" cy="13.5" r="1.5"/><circle cx="7.5" cy="13.5" r="1.5"/></svg>';
const COLOUR_MAP = { white: '#eaeaea', yellow: '#FFD700', red: '#ff1414' };
const POSITION_LABELS = {
  'top-left': 'Top Left', 'top-center': 'Top Center', 'top-right': 'Top Right',
  'middle-left': 'Middle Left', 'middle-center': 'Middle Center', 'middle-right': 'Middle Right',
  'bottom-left': 'Bottom Left', 'bottom-center': 'Bottom Center', 'bottom-right': 'Bottom Right'
};

const ICONS = {
  play: '<svg viewBox="0 0 20 20" fill="currentColor"><path d="M6 4l10 6-10 6V4z"/></svg>',
  pause: '<svg viewBox="0 0 20 20" fill="currentColor"><rect x="5" y="4" width="4" height="12"/><rect x="11" y="4" width="4" height="12"/></svg>',
  stop: '<svg viewBox="0 0 20 20" fill="currentColor"><rect x="5" y="5" width="10" height="10"/></svg>',
  restart: '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6A6 6 0 1 0 16 11"/><path d="M16 3v4h-4"/></svg>',
  trash: '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h12M8 6V4a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v2M6 6l1 11a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1l1-11"/></svg>',
  up: '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 13l6-6 6 6"/></svg>',
  down: '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7l6 6 6-6"/></svg>',

};

const TYPE_LABELS = { countdown: 'Countdown', countup: 'Countup', 'altar-call': 'Altar Call', blank: 'Blank' };
const typeLabel = t => TYPE_LABELS[t.type] || 'Countdown';
const isBlank = t => t.type === 'blank'; // blank slide: output shows nothing
const isCountdown = t => t.type !== 'countup' && t.type !== 'blank'; // altar call counts down

let timers = [];
let runtime = {};
let selectedId = null;
let editingId = null;      // control row whose timer length is being edited
let editingValue = '';
let rerendering = false;   // true while the control list is being rebuilt (ignores the blur that causes)
let editingName = null;    // { id, where: 'preview' | 'row' } while a timer name is being typed
let nameEditValue = '';
let liveCleared = false;   // set by clicking away; the live box stays empty until a timer is selected or started
let liveId = null;         // id of the timer currently painted in the live box
let liveSwapTimer = null;  // pending fade-out before the live box switches timer
const LIVE_FADE_MS = 250;

// ---------- Utility ----------
function formatTime(totalSeconds) {
  totalSeconds = Math.max(0, Math.floor(totalSeconds));
  const m = Math.floor(totalSeconds / 60);
  const s = totalSeconds % 60;
  // No leading zero on minutes: 5:00 shows as "5:00", 12:00 as "12:00"
  return `${m}:${String(s).padStart(2, '0')}`;
}

function nowHHMMSS() {
  return new Date().toLocaleTimeString('en-US', { hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' });
}
function nowHHMM() {
  return new Date().toLocaleTimeString('en-US', { hour12: true, hour: 'numeric', minute: '2-digit' });
}

function getElapsed(id) {
  const r = runtime[id];
  if (!r) return 0;
  if (r.isRunning) return r.elapsedBase + (performance.now() - r.startedAt) / 1000;
  return r.elapsedBase;
}

function getDisplayValue(timer) {
  const elapsed = getElapsed(timer.id);
  if (isCountdown(timer)) return Math.max(0, timer.duration_seconds - elapsed);
  return elapsed;
}

function getState(timer) {
  const r = runtime[timer.id];
  if (!r) return 'stopped';
  return r.isRunning ? 'running' : (r.isPaused ? 'paused' : 'stopped');
}

// Fixed-cutoff colour: >50% remaining = green, 20-50% = yellow, <20% = red.
// Countup timers while running are always green (no "approaching zero" signal).
function getRunColour(timer) {
  const r = runtime[timer.id];
  if (!r || !r.isRunning) return null;
  if (timer.type === 'countup') return 'green';
  const remainingFraction = Math.max(0, timer.duration_seconds - getElapsed(timer.id)) / timer.duration_seconds;
  if (remainingFraction > 0.5) return 'green';
  if (remainingFraction > 0.2) return 'yellow';
  return 'red';
}

function applyRunColour(el, colour) {
  el.classList.toggle('running', !!colour);
  el.classList.toggle('warn', colour === 'yellow');
  el.classList.toggle('crit', colour === 'red');
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = String(str);
  return div.innerHTML;
}

// ---------- Log ----------
function loadLog() {
  try { return JSON.parse(localStorage.getItem(LOG_KEY)) || []; } catch (e) { return []; }
}
function saveLog(entries) { localStorage.setItem(LOG_KEY, JSON.stringify(entries)); }
function addLog(name, action, extra) {
  const entries = loadLog();
  entries.unshift({ time: nowHHMMSS(), name, action, extra: extra || '' });
  saveLog(entries.slice(0, 200));
  renderLog();
}
function renderLog() {
  const el = document.getElementById('log-entries');
  const entries = loadLog();
  if (entries.length === 0) {
    el.innerHTML = '<div class="empty-state" style="padding:12px 0;">No log entries yet</div>';
    return;
  }
  el.innerHTML = entries.map(e =>
    `<div class="log-entry"><span class="log-time">[${e.time}]</span><span class="log-name">${escapeHtml(e.name)}</span> — ${escapeHtml(e.action)}${e.extra ? ' (' + escapeHtml(e.extra) + ')' : ''}</div>`
  ).join('');
}
document.getElementById('clear-log-btn').addEventListener('click', () => { saveLog([]); renderLog(); });

// ---------- API ----------
async function fetchTimers() {
  timers = await Store.listTimers();
  applySavedOrder();
  timers.forEach(t => {
    if (!runtime[t.id]) runtime[t.id] = { isRunning: false, isPaused: false, elapsedBase: 0, startedAt: 0 };
  });
  renderAll();
}

// Store.* uses the local server when server.pl is running, and this browser's storage otherwise (e.g. GitHub Pages)
function createTimer(payload) { return Store.createTimer(payload); }
function updateTimer(id, payload) { return Store.updateTimer(id, payload); }
function deleteTimer(id) { return Store.deleteTimer(id); }

// ---------- Timer scene (shared by form preview, preview grid and live box) ----------
function sceneHTML({ name, value, colour, size, position, showTime, extraClass = '', attrs = '', nameColour = '#fff' }) {
  const alignV = position.startsWith('top') ? 'flex-start' : (position.startsWith('bottom') ? 'flex-end' : 'center');
  const alignH = position.endsWith('left') ? 'flex-start' : (position.endsWith('right') ? 'flex-end' : 'center');
  const textAlign = alignH === 'flex-start' ? 'left' : (alignH === 'flex-end' ? 'right' : 'center');
  return `
    <div class="scene size-${size} ${extraClass}" ${attrs}>
      <div class="scene-inner" style="justify-content:${alignV}; align-items:${alignH}; text-align:${textAlign};">
        ${name ? `<div class="scene-name" style="color:${nameColour}">${escapeHtml(name)}</div>` : ''}
        <div class="scene-value" style="color:${COLOUR_MAP[colour] || '#eaeaea'}">${value}</div>
        ${showTime ? `<div class="scene-clock">${nowHHMM()}</div>` : ''}
      </div>
    </div>`;
}

// ---------- Create form ----------
// Parses "MM:SS" into seconds; returns NaN if the format is invalid.
function parseDuration(str) {
  const m = /^(\d{1,3}):([0-5]\d)$/.exec(str.trim());
  return m ? parseInt(m[1], 10) * 60 + parseInt(m[2], 10) : NaN;
}


// Countup timers have no duration, so the field is disabled and not required
function updateDurationField() {
  const isCountup = document.getElementById('f-type').value === 'countup';
  const input = document.getElementById('f-duration');
  input.disabled = isCountup;
  input.required = !isCountup;
  input.closest('.field').classList.toggle('is-disabled', isCountup);
  if (isCountup) input.value = '';
}

// ---------- Form preview & Show Current Time logic ----------

function updateFormPreview() {
  const typedName = document.getElementById('f-name').value.trim();
  const duration = parseDuration(document.getElementById('f-duration').value) || 0;
  const showCurrentTime = document.getElementById('f-show-current-time').checked;
  const showTitle = document.getElementById('f-show-title').checked;
  const size = document.getElementById('f-size').value;
  const colour = document.getElementById('f-colour').value;
  const position = document.getElementById('f-position').value;

  const previewEl = document.getElementById('form-preview');

  if (!typedName && duration === 0) {
    previewEl.style.display = 'none';
    return;
  }

  previewEl.style.display = 'block';
  previewEl.innerHTML = sceneHTML({
    name: showTitle ? typedName : '',
    value: formatTime(duration), colour, size, position, showTime: showCurrentTime
  });
}

document.getElementById('f-name').addEventListener('input', updateFormPreview);
// The colon is always shown and digits fill in from the right, so typing 300 gives 03:00
function withColon(value) {
  const typed = value.replace(/\D/g, '');
  if (!typed) return '';
  const digits = typed.replace(/^0+/, '').slice(-5) || '0';
  const seconds = digits.slice(-2).padStart(2, '0');
  const minutes = digits.slice(0, -2) || '0';
  return `${minutes.padStart(2, '0')}:${seconds}`;
}
function formatDurationInput(e) {
  e.target.value = withColon(e.target.value);
}
document.getElementById('f-duration').addEventListener('input', formatDurationInput);
document.getElementById('f-duration').addEventListener('input', updateFormPreview);
document.getElementById('f-size').addEventListener('change', updateFormPreview);
let priorColour = 'white';
let typeColourForced = false;
let priorName = '';
let priorPosition = 'middle-center';
let priorSize = 'large';
let typeAltarForced = false;
document.getElementById('f-type').addEventListener('change', () => {
  const colourSel = document.getElementById('f-colour');
  const nameEl = document.getElementById('f-name');
  const posSel = document.getElementById('f-position');
  const sizeSel = document.getElementById('f-size');
  const type = document.getElementById('f-type').value;

  // Countup and Altar Call both force a colour; only Altar Call also forces name/position/size.
  const forcedColour = { countup: 'red', 'altar-call': 'yellow' }[type];
  if (forcedColour) {
    if (!typeColourForced) priorColour = colourSel.value;
    colourSel.value = forcedColour;
  } else {
    colourSel.value = priorColour;
  }
  typeColourForced = !!forcedColour;

  if (type === 'altar-call') {
    if (!typeAltarForced) {
      priorName = nameEl.value;
      priorPosition = posSel.value;
      priorSize = sizeSel.value;
    }
    nameEl.value = 'Altar Call';
    posSel.value = 'middle-center';
    sizeSel.value = 'large';
    typeAltarForced = true;
  } else if (typeAltarForced) {
    nameEl.value = priorName;
    posSel.value = priorPosition;
    sizeSel.value = priorSize;
    typeAltarForced = false;
  }

  updateDurationField();
  updateFormPreview();
});
document.getElementById('f-colour').addEventListener('change', updateFormPreview);
document.getElementById('f-show-title').addEventListener('change', updateFormPreview);
document.getElementById('f-show-current-time').addEventListener('change', updateFormPreview);
document.getElementById('f-position').addEventListener('change', updateFormPreview);

document.getElementById('create-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errorEl = document.getElementById('create-error');
  errorEl.style.display = 'none';

  const payload = {
    name: document.getElementById('f-name').value.trim(),
    duration_seconds: document.getElementById('f-type').value === 'countup' ? 0 : parseDuration(document.getElementById('f-duration').value),
    type: document.getElementById('f-type').value,
    position: document.getElementById('f-position').value,
    size: document.getElementById('f-size').value,
    colour: document.getElementById('f-colour').value,
    show_title: document.getElementById('f-show-title').checked,
    show_current_time: document.getElementById('f-show-current-time').checked
  };

  if (!payload.name) { errorEl.textContent = 'Timer name is required.'; errorEl.style.display = 'block'; return; }
  if (payload.type !== 'countup' && (!Number.isFinite(payload.duration_seconds) || payload.duration_seconds < 1)) {
    errorEl.textContent = 'Enter a duration as MM:SS (at least 00:01).'; errorEl.style.display = 'block'; return;
  }

  try {
    const created = await createTimer(payload);
    runtime[created.id] = { isRunning: false, isPaused: false, elapsedBase: 0, startedAt: 0 };
    timers.push(created);
    saveOrder();
    addLog(created.name, 'CREATED', (created.type === 'countup' || created.type === 'blank') ? '' : `Duration: ${created.duration_seconds}s`);
    document.getElementById('create-form').reset();
    updateDurationField();
    document.getElementById('f-size').value = 'large';
    document.getElementById('f-colour').value = 'white';
    document.getElementById('f-show-title').checked = true;
    priorColour = 'white';
    typeColourForced = false;
    priorName = '';
    priorPosition = 'middle-center';
    priorSize = 'large';
    typeAltarForced = false;
    updateFormPreview();
    renderAll();
  } catch (err) {
    errorEl.textContent = err.message;
    errorEl.style.display = 'block';
  }
});

// ---------- Blank slide ----------
document.getElementById('add-blank-btn').addEventListener('click', async () => {
  const errorEl = document.getElementById('blank-error');
  errorEl.style.display = 'none';
  try {
    const created = await createTimer({
      name: 'Blank', duration_seconds: 0, type: 'blank', position: 'middle-center',
      size: 'large', colour: 'white', show_title: true, show_current_time: false
    });
    runtime[created.id] = { isRunning: false, isPaused: false, elapsedBase: 0, startedAt: 0 };
    timers.push(created);
    saveOrder();
    addLog(created.name, 'CREATED', 'Blank slide');
    renderAll();
  } catch (err) {
    errorEl.textContent = err.message;
    errorEl.style.display = 'block';
  }
});

// ---------- In-app dialogs (replace the browser's confirm and alert boxes) ----------
// The dialog sits in the middle of the screen over a full-screen backdrop. Clicking the backdrop does nothing,
// so it has to be answered with one of its buttons, Enter or Escape. Tab stays inside the dialog.
let modalResolve = null;
let modalCancelValue = false;

function showDialog({ title, message, buttons }) {
  return new Promise(resolve => {
    modalResolve = resolve;
    document.getElementById('modal-title').textContent = title;
    document.getElementById('modal-message').textContent = message;
    const actions = document.getElementById('modal-actions');
    actions.innerHTML = '';
    buttons.forEach(b => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = `btn ${b.className}`;
      btn.textContent = b.label;
      btn.addEventListener('click', () => closeDialog(b.value));
      actions.appendChild(btn);
    });
    // Destructive dialogs start on Cancel so pressing Enter by accident does nothing harmful
    const focusIndex = buttons.some(b => b.className === 'btn-danger') ? 0 : buttons.length - 1;
    document.getElementById('app-modal').style.display = 'flex';
    actions.children[focusIndex].focus(); // focus only works once the dialog is visible
  });
}

function closeDialog(value) {
  document.getElementById('app-modal').style.display = 'none';
  const resolve = modalResolve;
  modalResolve = null;
  if (resolve) resolve(value);
}

// Resolves true if the user confirms, false if they cancel
function askConfirm(message, { title = 'Are you sure?', confirmLabel = 'Confirm', danger = false } = {}) {
  return showDialog({
    title,
    message,
    buttons: [
      { label: 'Cancel', className: 'btn-secondary', value: modalCancelValue },
      { label: confirmLabel, className: danger ? 'btn-danger' : 'btn-primary', value: true }
    ]
  });
}

function showAlert(message) {
  return showDialog({
    title: 'Something went wrong',
    message,
    buttons: [{ label: 'OK', className: 'btn-primary', value: true }]
  }).then(() => {});
}

document.addEventListener('keydown', e => {
  if (!modalResolve) return;
  if (e.key === 'Escape') {
    e.preventDefault();
    closeDialog(modalCancelValue);
  } else if (e.key === 'Enter') {
    e.preventDefault();
    if (document.activeElement && document.activeElement.closest('#modal-actions')) document.activeElement.click();
  } else if (e.key === 'Tab') {
    // Keep focus on the dialog buttons
    e.preventDefault();
    const buttons = [...document.querySelectorAll('#modal-actions .btn')];
    const i = buttons.indexOf(document.activeElement);
    buttons[(i + (e.shiftKey ? -1 : 1) + buttons.length) % buttons.length].focus();
  }
});

// ---------- Right-click menu + duplicate ----------
let ctxId = null;
const ctxMenu = document.getElementById('ctx-menu');
document.getElementById('ctx-duplicate').innerHTML = ICONS.copy + '<span>Duplicate</span>';
document.getElementById('ctx-delete').innerHTML = ICONS.trash + '<span>Delete</span>';

function hideCtxMenu() { ctxMenu.style.display = 'none'; ctxId = null; }

document.addEventListener('contextmenu', e => {
  if (e.target.closest('input, textarea')) return; // keep the normal menu inside text boxes
  const item = e.target.closest('.preview-card, .control-row');
  if (!item) { hideCtxMenu(); return; }
  e.preventDefault();
  ctxId = Number(item.dataset.id);
  ctxMenu.style.display = 'block';
  const x = Math.min(e.clientX, window.innerWidth - ctxMenu.offsetWidth - 4);
  const y = Math.min(e.clientY, window.innerHeight - ctxMenu.offsetHeight - 4);
  ctxMenu.style.left = Math.max(0, x) + 'px';
  ctxMenu.style.top = Math.max(0, y) + 'px';
});
document.addEventListener('mousedown', e => { if (!ctxMenu.contains(e.target)) hideCtxMenu(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') hideCtxMenu(); });
window.addEventListener('resize', hideCtxMenu);
window.addEventListener('blur', hideCtxMenu);
document.addEventListener('scroll', hideCtxMenu, true);

document.getElementById('ctx-duplicate').addEventListener('click', () => {
  const id = ctxId;
  hideCtxMenu();
  if (id !== null) duplicateTimer(id);
});

// Same confirmation and cleanup as the trash button on the control row
document.getElementById('ctx-delete').addEventListener('click', () => {
  const id = ctxId;
  hideCtxMenu();
  if (id !== null) removeTimer(id);
});

// Creates a copy with the same settings and places it right after the original
async function duplicateTimer(id) {
  const t = timers.find(x => x.id === id);
  if (!t) return;
  try {
    const created = await createTimer({
      name: `${t.name.slice(0, 32)} (copy)`,
      duration_seconds: t.duration_seconds,
      type: t.type,
      position: t.position,
      size: t.size,
      colour: t.colour,
      show_title: !!t.show_title,
      show_current_time: !!t.show_current_time
    });
    runtime[created.id] = { isRunning: false, isPaused: false, elapsedBase: 0, startedAt: 0 };
    const idx = timers.findIndex(x => x.id === id);
    timers.splice(idx + 1, 0, created);
    saveOrder();
    addLog(created.name, 'DUPLICATED', `from ${t.name}`);
    renderAll();
  } catch (err) {
    await showAlert(err.message);
  }
}

// ---------- Selection ----------
function selectTimer(id) {
  selectedId = id;
  liveCleared = false;
  // Countup timers autostart the first time they are opened
  const t = timers.find(tm => tm.id === id);
  const r = runtime[id];
  if (t && r && t.type === 'countup' && !r.isRunning && !r.isPaused && r.elapsedBase === 0) {
    startTimer(id);
    return;
  }
  // Every click on an Altar Call timer starts it: a paused one resumes, anything else starts from the beginning
  if (t && r && t.type === 'altar-call' && !r.isRunning) {
    if (!r.isPaused) {
      r.elapsedBase = 0;
      r.startedClock = null;
    }
    startTimer(id);
    return;
  }
  renderAll();
}

// ---------- Timer controls ----------
function playPauseToggle(id) {
  const r = runtime[id];
  if (r.isRunning) pauseTimer(id); else startTimer(id);
}

function startTimer(id) {
  const timer = timers.find(t => t.id === id);
  const r = runtime[id];
  const wasPaused = r.isPaused;
  liveCleared = false;
  r.isRunning = true;
  r.isPaused = false;
  r.startedAt = performance.now();
  if (!wasPaused) r.startedClock = nowHHMM();
  addLog(timer.name, wasPaused ? 'RESUMED' : 'STARTED', typeLabel(timer));
  renderAll();
}

function pauseTimer(id) {
  const timer = timers.find(t => t.id === id);
  const r = runtime[id];
  r.elapsedBase = getElapsed(id);
  r.isRunning = false;
  r.isPaused = true;
  addLog(timer.name, 'PAUSED', typeLabel(timer));
  renderAll();
}

function stopTimer(id) {
  const timer = timers.find(t => t.id === id);
  const r = runtime[id];
  r.isRunning = false;
  r.isPaused = false;
  r.elapsedBase = 0;
  r.startedClock = null;
  addLog(timer.name, 'ENDED', typeLabel(timer));
  renderAll();
}

// Resets to the original value without starting; the user presses play to start.
async function restartTimer(id) {
  const timer = timers.find(t => t.id === id);
  if (!timer || !(await askConfirm(`Reset "${timer.name}" to its original length? It will not start until you press play.`, { title: 'Reset timer', confirmLabel: 'Reset', danger: true }))) return;
  const r = runtime[id];
  r.elapsedBase = 0;
  r.startedClock = null;
  r.isRunning = false;
  r.isPaused = false;
  addLog(timer.name, 'RESET', typeLabel(timer));
  renderAll();
}

async function removeTimer(id) {
  const timer = timers.find(t => t.id === id);
  if (!timer) return;
  if (!(await askConfirm(`Delete "${timer.name}"? This cannot be undone.`, { title: 'Delete timer', confirmLabel: 'Delete', danger: true }))) return;
  try {
    await deleteTimer(id);
    timers = timers.filter(t => t.id !== id);
    delete runtime[id];
    if (selectedId === id) selectedId = null;
    addLog(timer.name, 'DELETED');
    renderAll();
  } catch (err) {
    await showAlert(err.message);
  }
}

// ---------- Rendering ----------
function renderAll() {
  renderPreviews();
  renderControlRows();
  renderEditor();
  renderLiveBox();
  pushLive();
  // Re-rendering replaces the name input, so put the cursor back in it
  const nameInput = document.querySelector('.name-input');
  if (nameInput && document.activeElement !== nameInput) nameInput.focus();
}

// The timer shown in the live box is also what output.html displays
function getShownTimer() {
  if (liveCleared) return null;
  let shown = null;
  if (selectedId !== null) shown = timers.find(t => t.id === selectedId) || null;
  if (!shown) shown = timers.find(t => runtime[t.id] && runtime[t.id].isRunning) || null;
  if (!shown) shown = timers.find(t => runtime[t.id] && (runtime[t.id].isPaused || runtime[t.id].elapsedBase > 0)) || null;
  return shown;
}

function pushLive() {
  const shown = getShownTimer();
  Store.setLive({
    timer: shown,
    elapsed: shown ? getElapsed(shown.id) : 0,
    isRunning: shown ? !!runtime[shown.id].isRunning : false
  }).catch(() => {});
}

function renderPreviews() {
  const el = document.getElementById('preview-list');
  const scroll = el.scrollTop;
  if (timers.length === 0) { el.innerHTML = '<div class="empty-state">No timers created yet.</div>'; return; }
  rerendering = true;
  el.innerHTML = timers.map(t => `
    <div class="preview-card ${selectedId === t.id ? 'selected' : ''}" data-id="${t.id}" draggable="${isNameEditing(t, 'preview') ? 'false' : 'true'}" onclick="selectTimer(${t.id})">
      ${sceneHTML({
        name: !isBlank(t) && t.show_title ? t.name : '',
        value: isBlank(t) ? '' : formatTime(getDisplayValue(t)),
        colour: t.colour, size: t.size, position: t.position, showTime: !isBlank(t) && !!t.show_current_time,
      })}
      <div class="preview-footer" style="color:#fff">${nameHTML(t, 'preview')}</div>
    </div>`).join('');
  setTimeout(() => { rerendering = false; }, 0);
  timers.forEach(t => {
    const card = el.querySelector(`.preview-card[data-id="${t.id}"]`);
    if (card) applyRunColour(card, getRunColour(t));
  });
  bindDrag(el, '.preview-card', false);
  el.scrollTop = scroll;
}


function fmtDur(sec) {
  sec = Math.max(0, Math.floor(sec));
  const m = Math.floor(sec / 60), r = sec % 60;
  return m ? `${m}m ${String(r).padStart(2, '0')}s` : `${r}s`;
}

// Stats under each control row (updated every frame by tick()).
// Countdown and altar call timers show a progress bar: grey while not started, blue for the time passed.
// Countup timers have no length, so there is nothing to fill; they keep Started and Elapsed.
function rowStatsHTML(t) {
  if (isBlank(t)) return '';
  if (isCountdown(t)) {
    const fraction = Math.min(1, getElapsed(t.id) / t.duration_seconds);
    return `<div class="row-progress" title="${Math.round(fraction * 100)}% elapsed"><div class="row-progress-fill" style="width:${(fraction * 100).toFixed(2)}%"></div></div>`;
  }
  const r = runtime[t.id];
  const started = r && r.startedClock ? r.startedClock : '--:--';
  return `<div>Started:<b>${started}</b></div><div>Elapsed:<b>${fmtDur(getElapsed(t.id))}</b></div>`;
}

function renderControlRows() {
  const el = document.getElementById('control-rows');
  const scroll = el.scrollTop;
  if (timers.length === 0) { el.innerHTML = '<div class="empty-state">No timers yet.</div>'; el.style.maxHeight = ''; return; }
  rerendering = true;
  el.innerHTML = timers.map((t, i) => {
    const r = runtime[t.id];
    const state = getState(t);
    const mainBtn = isBlank(t) ? '' : r.isRunning
      ? `<button class="icon-btn" title="Pause" onclick="pauseTimer(${t.id})">${ICONS.pause}</button>`
      : `<button class="icon-btn" title="${r.isPaused ? 'Resume' : 'Start'}" onclick="startTimer(${t.id})">${ICONS.play}</button>`;
    return `
      <div class="control-row ${selectedId === t.id ? 'selected' : ''}" data-id="${t.id}">
        <div class="move-col">
          <button class="move-btn" title="Move up" ${i === 0 ? 'disabled' : ''} onclick="moveTimerBy(${t.id}, -1)">${ICONS.up}</button>
          <div class="drag-handle" title="Drag to reorder">${DRAG_HANDLE}</div>
          <button class="move-btn" title="Move down" ${i === timers.length - 1 ? 'disabled' : ''} onclick="moveTimerBy(${t.id}, 1)">${ICONS.down}</button>
        </div>
        <div class="row-info" onclick="selectTimer(${t.id})">
          <div class="row-name" style="color:#fff">${nameHTML(t, 'row')}</div>
          <div class="row-state">${isBlank(t) ? 'Blank slide · Shows nothing' : typeLabel(t) + ' · ' + state.charAt(0).toUpperCase() + state.slice(1)}</div>
          ${timeCellHTML(t)}
          <div class="row-stats">${rowStatsHTML(t)}</div>
        </div>
        <div class="row-icons">
          ${mainBtn}
          ${isBlank(t) ? '' : `<button class="icon-btn" title="Restart" onclick="restartTimer(${t.id})">${ICONS.restart}</button>`}
          <button class="icon-btn icon-danger" title="Delete" onclick="removeTimer(${t.id})">${ICONS.trash}</button>
        </div>
      </div>
    `;
  }).join('');
  setTimeout(() => { rerendering = false; }, 0);
  timers.forEach(t => {
    const row = el.querySelector(`.control-row[data-id="${t.id}"]`);
    if (row) applyRunColour(row, getRunColour(t));
  });
  bindDrag(el, '.control-row', true);
  restoreEditFocus();
  limitVisibleRows();
  el.scrollTop = scroll;
}

// ---------- Edit a timer's name from the preview footer or the control row ----------
// `where` says which of the two places is being edited, so only that one turns into a text box
function isNameEditing(t, where) {
  return !!editingName && editingName.id === t.id && editingName.where === where;
}

function nameHTML(t, where) {
  if (isNameEditing(t, where)) {
    return `<input class="name-input" type="text" maxlength="40" spellcheck="false" autocomplete="off" value="${escapeHtml(nameEditValue).replace(/"/g, '&quot;')}"
      oninput="nameEditValue = this.value"
      onkeydown="nameKey(event, ${t.id})"
      onblur="commitName(${t.id}, true)"
      onclick="event.stopPropagation()">`;
  }
  return `<span class="editable-name" title="Click to rename" onclick="event.stopPropagation(); startNameEdit(${t.id}, '${where}')">${escapeHtml(t.name)}</span>`;
}

function startNameEdit(id, where) {
  const t = timers.find(x => x.id === id);
  if (!t) return;
  editingName = { id, where };
  nameEditValue = t.name;
  renderAll();
  const input = document.querySelector('.name-input');
  if (input) input.select();
}

function nameKey(e, id) {
  if (e.key === 'Enter') { e.preventDefault(); commitName(id, false); }
  else if (e.key === 'Escape') { e.preventDefault(); cancelName(); }
}

function cancelName() {
  editingName = null;
  renderAll();
}

async function commitName(id, fromBlur) {
  if (!editingName || editingName.id !== id || (fromBlur && rerendering)) return;
  const t = timers.find(x => x.id === id);
  const name = nameEditValue.trim();
  editingName = null;
  if (!t || !name || name === t.name) return renderAll();
  const oldName = t.name;
  try {
    const updated = await updateTimer(id, { name });
    t.name = updated.name;
    addLog(t.name, 'RENAMED', `from ${oldName}`);
  } catch (err) {
    await showAlert(err.message);
  }
  renderAll();
}

// ---------- Edit a timer's length from the control list ----------
// Accepts H:MM:SS, MM:SS, or just a number (minutes). Returns NaN if invalid.
function parseEditDuration(str) {
  str = String(str).trim();
  let m;
  if ((m = /^(\d{1,2}):([0-5]\d):([0-5]\d)$/.exec(str))) return (+m[1]) * 3600 + (+m[2]) * 60 + (+m[3]);
  if ((m = /^(\d{1,3}):([0-5]\d)$/.exec(str))) return (+m[1]) * 60 + (+m[2]);
  if ((m = /^(\d{1,3})$/.exec(str))) return (+m[1]) * 60;
  return NaN;
}

function timeCellHTML(t) {
  if (isBlank(t)) return '<div class="row-time" style="color:var(--text-dim)">BLANK</div>';
  const colour = COLOUR_MAP[t.colour] || '#eaeaea';
  if (!isCountdown(t)) return `<div class="row-time" style="color:${colour}">${formatTime(getDisplayValue(t))}</div>`;
  if (editingId === t.id) {
    return `<input class="row-time-input" type="text" maxlength="8" placeholder="MM:SS" spellcheck="false" autocomplete="off"
      oninput="editingValue = withColon(this.value); this.value = editingValue; this.classList.remove('invalid')"
      onkeydown="editKey(event, ${t.id})"
      onblur="commitEdit(${t.id}, true)"
      onclick="event.stopPropagation()">`;
  }
  return `<div class="row-time editable" title="Click to change the timer length" style="color:${colour}"
    onclick="event.stopPropagation(); startEdit(${t.id})">${formatTime(getDisplayValue(t))}</div>`;
}

function startEdit(id) {
  const t = timers.find(x => x.id === id);
  if (!t || !isCountdown(t)) return;
  editingId = id;
  editingValue = formatTime(t.duration_seconds);
  renderControlRows();
  const input = document.querySelector('.row-time-input');
  if (input) { input.focus(); input.select(); }
}

function restoreEditFocus() {
  if (editingId === null) return;
  const input = document.querySelector('.row-time-input');
  if (!input) return;
  input.value = editingValue;
  input.focus();
  input.setSelectionRange(input.value.length, input.value.length);
}

function cancelEdit() {
  editingId = null;
  renderControlRows();
}

function editKey(e, id) {
  if (e.key === 'Enter') { e.preventDefault(); commitEdit(id, false); }
  else if (e.key === 'Escape') { e.preventDefault(); cancelEdit(); }
}

async function commitEdit(id, fromBlur) {
  if (editingId !== id || (fromBlur && rerendering)) return;
  const t = timers.find(x => x.id === id);
  const secs = parseEditDuration(editingValue);
  if (!t || !Number.isFinite(secs) || secs < 1) {
    if (fromBlur || !t) return cancelEdit();
    const input = document.querySelector('.row-time-input');
    if (input) input.classList.add('invalid');
    return;
  }
  if (secs === t.duration_seconds) return cancelEdit();

  const r = runtime[id];
  editingId = null;
  if (r && (r.isRunning || r.isPaused) && !(await askConfirm(`Change "${t.name}" to ${formatTime(secs)}? This resets the timer.`, { title: 'Change length', confirmLabel: 'Change', danger: true }))) {
    renderControlRows();
    return;
  }
  try {
    const updated = await updateTimer(id, { duration_seconds: secs });
    t.duration_seconds = updated.duration_seconds;
    r.isRunning = false;
    r.isPaused = false;
    r.elapsedBase = 0;
    r.startedClock = null;
    addLog(t.name, 'EDITED', `Set to ${fmtDur(secs)}`);
  } catch (err) {
    await showAlert(err.message);
  }
  renderAll();
}

// Shows at most 4 control rows; the rest are reached by scrolling the list
const VISIBLE_CONTROL_ROWS = 4;
function limitVisibleRows() {
  const el = document.getElementById('control-rows');
  const rows = el.querySelectorAll('.control-row');
  if (rows.length <= VISIBLE_CONTROL_ROWS) { el.style.maxHeight = ''; return; }
  const last = rows[VISIBLE_CONTROL_ROWS - 1];
  const bottom = last.getBoundingClientRect().bottom - el.getBoundingClientRect().top + el.scrollTop;
  el.style.maxHeight = (bottom + 4) + 'px';
}

// ---------- Timer editor (bottom middle column) ----------
// Opens for the selected timer and uses the same inputs as the Create Timer form.
// It is only rebuilt when a different timer is selected, so typing is not lost when other parts re-render.
let editorId = null; // timer whose settings are currently in the editor form
const EDIT_FORCED_COLOUR = { countup: 'red', 'altar-call': 'yellow' };

function renderEditor(force) {
  const el = document.getElementById('timer-editor');
  const t = selectedId === null ? null : timers.find(x => x.id === selectedId);
  if (!t || isBlank(t)) {
    editorId = null;
    el.innerHTML = `<div class="empty-state editor-empty">${t ? 'Blank slides have no settings to edit.' : 'Select a timer to edit its settings.'}</div>`;
    return;
  }
  if (editorId === t.id && !force) return;
  editorId = t.id;

  el.innerHTML = `
    <form class="create-form editor-form" id="edit-form">
      <div class="editor-head">
        <div class="panel-title" title="${escapeHtml(t.name)}">Edit: ${escapeHtml(t.name)}</div>
        <button type="button" class="btn btn-secondary" id="edit-revert">Revert</button>
        <button type="submit" form="edit-form" class="btn btn-primary">Save</button>
        <button type="button" class="icon-btn" id="edit-close" title="Close editor" style="font-size:18px; line-height:1;">&times;</button>
      </div>
      <div class="editor-grid">
        <div class="field span-2">
          <label>Name</label>
          <input type="text" id="e-name" maxlength="40" required>
        </div>
        <div class="field">
          <label>Duration (MM:SS)</label>
          <input type="text" id="e-duration" placeholder="MM:SS" inputmode="numeric" pattern="\\d{1,3}:[0-5]\\d" maxlength="6">
        </div>
        <div class="field">
          <label>Type</label>
          <select id="e-type">
            <option value="countdown">Countdown</option>
            <option value="countup">Countup</option>
            <option value="altar-call">Altar Call</option>
          </select>
        </div>
        <div class="field">
          <label>Position</label>
          <select id="e-position">
            <option value="top-left">Top Left</option>
            <option value="top-center">Top Center</option>
            <option value="top-right">Top Right</option>
            <option value="middle-left">Middle Left</option>
            <option value="middle-center">Middle Center</option>
            <option value="middle-right">Middle Right</option>
            <option value="bottom-left">Bottom Left</option>
            <option value="bottom-center">Bottom Center</option>
            <option value="bottom-right">Bottom Right</option>
          </select>
        </div>
        <div class="field">
          <label>Size</label>
          <select id="e-size">
            <option value="extra-small">Extra Small</option>
            <option value="small">Small</option>
            <option value="medium">Medium</option>
            <option value="large">Large</option>
          </select>
        </div>
        <div class="field">
          <label>Colour</label>
          <select id="e-colour">
            <option value="white">White</option>
            <option value="yellow">Yellow</option>
            <option value="red">Red</option>
          </select>
        </div>
        <div class="field">
          <div class="check-stack">
            <label><input type="checkbox" id="e-show-title"> Show timer name</label>
            <label><input type="checkbox" id="e-show-current-time"> Show current time</label>
          </div>
        </div>
      </div>
      <div class="form-error" id="edit-error"></div>
    </form>`;

  document.getElementById('e-name').value = t.name;
  document.getElementById('e-duration').value = isCountdown(t) ? formatTime(t.duration_seconds) : '';
  document.getElementById('e-type').value = t.type;
  document.getElementById('e-position').value = t.position;
  document.getElementById('e-size').value = t.size;
  document.getElementById('e-colour').value = t.colour;
  document.getElementById('e-show-title').checked = !!t.show_title;
  document.getElementById('e-show-current-time').checked = !!t.show_current_time;
  updateEditDurationField();
}

// Countup has no length, so the duration field is disabled (same rule as the Create form)
function updateEditDurationField() {
  const type = document.getElementById('e-type').value;
  const input = document.getElementById('e-duration');
  const off = type === 'countup';
  input.disabled = off;
  input.required = !off;
  input.closest('.field').classList.toggle('is-disabled', off);
  if (off) input.value = '';
}

// Same forcing as the Create form: Countup and Altar Call set the colour, Altar Call also sets name, position and size
function onEditTypeChange() {
  const type = document.getElementById('e-type').value;
  if (EDIT_FORCED_COLOUR[type]) document.getElementById('e-colour').value = EDIT_FORCED_COLOUR[type];
  if (type === 'altar-call') {
    document.getElementById('e-name').value = 'Altar Call';
    document.getElementById('e-position').value = 'middle-center';
    document.getElementById('e-size').value = 'large';
  }
  updateEditDurationField();
}

async function saveEdit(e) {
  e.preventDefault();
  const t = timers.find(x => x.id === editorId);
  const errorEl = document.getElementById('edit-error');
  errorEl.style.display = 'none';
  if (!t) return;

  const type = document.getElementById('e-type').value;
  const payload = {
    name: document.getElementById('e-name').value.trim(),
    type,
    duration_seconds: type === 'countup' ? 0 : parseDuration(document.getElementById('e-duration').value),
    position: document.getElementById('e-position').value,
    size: document.getElementById('e-size').value,
    colour: document.getElementById('e-colour').value,
    show_title: document.getElementById('e-show-title').checked,
    show_current_time: document.getElementById('e-show-current-time').checked
  };

  const showError = msg => { errorEl.textContent = msg; errorEl.style.display = 'block'; };
  if (!payload.name) return showError('Timer name is required.');
  if (type !== 'countup' && (!Number.isFinite(payload.duration_seconds) || payload.duration_seconds < 1)) {
    return showError('Enter a duration as MM:SS (at least 00:01).');
  }

  // Compare against the stored timer so only real changes are saved and logged
  const labels = { name: 'name', type: 'type', duration_seconds: 'length', position: 'position', size: 'size',
                   colour: 'colour', show_title: 'show name', show_current_time: 'show time' };
  const norm = (k, v) => (k === 'show_title' || k === 'show_current_time') ? (v ? 1 : 0) : v;
  const changed = Object.keys(labels).filter(k => norm(k, t[k]) !== norm(k, payload[k])).map(k => labels[k]);
  if (changed.length === 0) return renderEditor(true);

  // Changing the length or type restarts the timer, so confirm first if it is running or paused
  const restarts = payload.duration_seconds !== t.duration_seconds || type !== t.type;
  const r = runtime[t.id];
  if (restarts && r && (r.isRunning || r.isPaused) && !(await askConfirm(`Save changes to "${t.name}"? This resets the timer.`, { title: 'Save changes', confirmLabel: 'Save', danger: true }))) return;

  try {
    const updated = await updateTimer(t.id, payload);
    Object.assign(t, updated);
    if (restarts) {
      r.isRunning = false;
      r.isPaused = false;
      r.elapsedBase = 0;
      r.startedClock = null;
    }
    addLog(t.name, 'EDITED', changed.join(', '));
    renderAll();
    renderEditor(true); // rebuild so the header and fields show the saved values
  } catch (err) {
    showError(err.message);
  }
}

function closeEditor() {
  selectedId = null;
  liveCleared = true;
  renderAll();
}

// Form events are handled on the container, because the form is rebuilt when a different timer is selected
const timerEditorEl = document.getElementById('timer-editor');
timerEditorEl.addEventListener('submit', saveEdit);
timerEditorEl.addEventListener('change', e => {
  if (e.target.id === 'e-type') onEditTypeChange();
});
timerEditorEl.addEventListener('input', e => {
  if (e.target.id === 'e-duration') e.target.value = withColon(e.target.value);
});
timerEditorEl.addEventListener('click', e => {
  if (e.target.closest('#edit-revert')) renderEditor(true);
  else if (e.target.closest('#edit-close')) closeEditor();
});

// ---------- Control row reordering ----------
let dragId = null;

// Shared by the control rows (drag by the handle) and the preview cards (drag anywhere on the card).
// Both lists show the same `timers` order, so a move in one is mirrored in the other.
function bindDrag(container, selector, useHandle) {
  container.querySelectorAll(selector).forEach(item => {
    if (useHandle) {
      item.querySelector('.drag-handle').addEventListener('mousedown', () => { item.draggable = true; });
    }
    item.addEventListener('dragstart', e => {
      dragId = Number(item.dataset.id);
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', String(dragId));
      item.classList.add('dragging');
    });
    item.addEventListener('dragend', () => {
      dragId = null;
      if (useHandle) item.draggable = false;
      item.classList.remove('dragging');
      clearDropTargets();
    });
    item.addEventListener('dragover', e => {
      if (dragId === null) return;
      e.preventDefault();
      clearDropTargets();
      item.classList.add('drop-target');
    });
    item.addEventListener('dragleave', () => item.classList.remove('drop-target'));
    item.addEventListener('drop', e => {
      if (dragId === null) return;
      e.preventDefault();
      moveTimer(dragId, Number(item.dataset.id));
    });
  });
}

// A press that never turns into a drag should leave the row non-draggable so text stays selectable
document.addEventListener('mouseup', () => {
  if (dragId === null) document.querySelectorAll('.control-row[draggable="true"]').forEach(r => { r.draggable = false; });
});

function clearDropTargets() {
  document.querySelectorAll('.drop-target').forEach(r => r.classList.remove('drop-target'));
}

function moveTimer(fromId, toId) {
  const from = timers.findIndex(t => t.id === fromId);
  const to = timers.findIndex(t => t.id === toId);
  if (from < 0 || to < 0 || from === to) { dragId = null; return renderControlRows(); }
  const [moved] = timers.splice(from, 1);
  timers.splice(to, 0, moved);
  dragId = null;
  saveOrder();
  renderAll();
}

function saveOrder() {
  localStorage.setItem(ORDER_KEY, JSON.stringify(timers.map(t => t.id)));
}

// Up/down arrow buttons on each control row (also works on touch screens, where dragging doesn't)
function moveTimerBy(id, delta) {
  const from = timers.findIndex(t => t.id === id);
  const to = from + delta;
  if (from < 0 || to < 0 || to >= timers.length) return;
  const [moved] = timers.splice(from, 1);
  timers.splice(to, 0, moved);
  saveOrder();
  renderAll();
}

function applySavedOrder() {
  let order = [];
  try { order = JSON.parse(localStorage.getItem(ORDER_KEY)) || []; } catch (e) {}
  const rank = id => { const i = order.indexOf(id); return i === -1 ? order.length : i; };
  timers.sort((a, b) => rank(a.id) - rank(b.id));
}

// Fades the live box out, switches to the timer now shown, then fades back in.
// Runs every frame, so the paint always uses liveId and only the switch is timed.
function renderLiveBox() {
  const stage = document.getElementById('live-stage');
  const shown = getShownTimer();
  const shownId = shown ? shown.id : null;

  if (shownId !== liveId && liveSwapTimer === null) {
    stage.classList.add('is-fading');
    liveSwapTimer = setTimeout(() => {
      liveSwapTimer = null;
      const next = getShownTimer();
      liveId = next ? next.id : null;
      // Paint the new timer while still faded out, then reflow so the removal of the class fades it in
      paintLiveBox(timers.find(t => t.id === liveId) || null);
      void stage.offsetWidth;
      stage.classList.remove('is-fading');
    }, LIVE_FADE_MS);
  }

  paintLiveBox(timers.find(t => t.id === liveId) || null);
}

// The scene markup is only rebuilt when its layout changes; the value and clock are updated in place each frame,
// so the text keeps the same elements and can fade while the outline stays put.
function paintLiveBox(shown) {
  const placeholder = document.getElementById('live-placeholder');
  const content = document.getElementById('live-content');

  if (!shown) {
    placeholder.style.display = 'block';
    content.style.display = 'none';
    content.dataset.key = '';
    return;
  }
  placeholder.style.display = 'none';
  content.style.display = 'block';

  const showTime = !isBlank(shown) && !!shown.show_current_time;
  const key = [shown.id, shown.name, shown.show_title, shown.colour, shown.size, shown.position, showTime, isBlank(shown)].join('|');
  if (content.dataset.key !== key) {
    content.dataset.key = key;
    content.innerHTML = sceneHTML({
      name: !isBlank(shown) && shown.show_title ? shown.name : '',
      value: isBlank(shown) ? '' : formatTime(getDisplayValue(shown)),
      colour: shown.colour, size: shown.size, position: shown.position, showTime,
    });
  } else {
    content.querySelector('.scene-value').textContent = isBlank(shown) ? '' : formatTime(getDisplayValue(shown));
    const clock = content.querySelector('.scene-clock');
    if (clock) clock.textContent = nowHHMM();
  }
}

// Clicking away from every timer takes the timer out of the live box; it keeps running in the controls.
// Uses click (not mousedown) so an open name edit has already committed on blur.
document.addEventListener('click', e => {
  if (e.target.closest('.preview-card, .control-row, #live-output-box, #timer-editor, #ctx-menu, #app-modal')) return;
  if (!getShownTimer()) return;
  selectedId = null;
  liveCleared = true;
  renderAll();
});

// ---------- Animation loop ----------
// Patches text/colour of running timers each frame without rebuilding
// row/button markup, which would otherwise swallow in-flight clicks.
function tick() {
  let structuralChange = false;
  timers.forEach(t => {
    const r = runtime[t.id];
    if (r && r.isRunning) {
      if (isCountdown(t)) {
        const remaining = t.duration_seconds - getElapsed(t.id);
        if (remaining <= 0) {
          r.elapsedBase = t.duration_seconds;
          r.isRunning = false;
          r.isPaused = false;
          addLog(t.name, 'ENDED', typeLabel(t));
          structuralChange = true;
          return;
        }
      }
      const value = formatTime(getDisplayValue(t));
      const card = document.querySelector(`.preview-card[data-id="${t.id}"]`);
      if (card) {
        const pv = card.querySelector('.scene-value');
        if (pv) pv.textContent = value;
        applyRunColour(card, getRunColour(t));
      }
      const row = document.querySelector(`.control-row[data-id="${t.id}"]`);
      if (row) {
        const timeEl = row.querySelector('.row-time'); // absent while this row's length is being edited
        if (timeEl) {
          timeEl.textContent = value;
          timeEl.style.color = COLOUR_MAP[t.colour] || '#eaeaea';
        }
        row.querySelector('.row-stats').innerHTML = rowStatsHTML(t);
        applyRunColour(row, getRunColour(t));
      }
    }
  });
  if (structuralChange) { renderPreviews(); renderControlRows(); pushLive(); }
  document.querySelectorAll('#preview-list .scene-clock').forEach(s => s.textContent = nowHHMM());
  renderLiveBox();
  requestAnimationFrame(tick);
}

// ---------- Second screen address (for mirroring on another computer) ----------
async function showMirrorInfo() {
  const el = document.getElementById('mirror-info');
  try {
    const n = await Store.network(); // null in browser mode (no server, so no second-screen address)
    if (!n) return;
    const urls = [n.hostname, ...n.addresses].map(h => `http://${h}:${n.port}/output.html`);
    el.innerHTML = 'Second screen — open on the other computer: <b>' + escapeHtml(urls[0]) + '</b>' +
      (urls.length > 1 ? '<br>or ' + urls.slice(1).map(escapeHtml).join(' · ') : '');
  } catch (e) {}
}

// ---------- Init ----------
showMirrorInfo();
renderLog();
fetchTimers();
setInterval(pushLive, 1000); // keeps output.html correct after a server restart
requestAnimationFrame(tick);
</script>
