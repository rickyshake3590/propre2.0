<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ProPre2.0 — Output</title>
<style>
  @font-face {
    font-family: 'Big Noodle Tilting';
    src: url('fonts/big_noodle_titling.ttf') format('truetype');
    font-display: swap;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #000;
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .scene {
    width: 100%;
    height: 100%;
    container-type: size;
    background: #000;
    border: none;
    border-radius: 0;
    overflow: hidden;
    font-family: 'Big Noodle Tilting', monospace;
  }
  .scene-inner { height: 100%; padding: 0; display: flex; flex-direction: column; transition: opacity 0.25s ease; }
  .scene-inner.is-fading { opacity: 0; }
  .scene-name { line-height: 0.85; white-space: nowrap; color: #fff; margin-bottom: 1cqh; font-family: Helvetica, Arial, sans-serif; font-weight: 700; }
  .scene-clock { line-height: 0.85; white-space: nowrap; color: #8a8a8a; margin-top: 1cqh; font-variant-numeric: tabular-nums; }
  .scene-value { line-height: 0.85; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .scene.size-extra-small .scene-value { font-size: 18cqh; }
  .scene.size-extra-small .scene-name { font-size: 5.25cqh; }
  .scene.size-extra-small .scene-clock { font-size: 8.25cqh; }
  .scene.size-small .scene-value { font-size: 24cqh; }
  .scene.size-medium .scene-value { font-size: 52cqh; }
  .scene.size-large .scene-value { font-size: 72cqh; }
  .scene.size-small .scene-name { font-size: 7cqh; }
  .scene.size-medium .scene-name { font-size: 9cqh; }
  .scene.size-large .scene-name { font-size: 11cqh; }
  .scene.size-small .scene-clock { font-size: 11cqh; }
  .scene.size-medium .scene-clock { font-size: 16cqh; }
  .scene.size-large .scene-clock { font-size: 20cqh; }
</style>
</head>
<body>

<div class="scene size-large" id="scene">
  <div class="scene-inner" id="scene-inner"></div>
</div>

<script src="js/store.js"></script>
<script>
const COLOUR_MAP = { white: '#eaeaea', yellow: '#FFD700', red: '#ff1414' };

let live = null;
let fetchedAt = 0;
const LIVE_FADE_MS = 250;
let paintedId = null;   // id of the timer currently on screen
let paintedKey = '';    // layout of the timer on screen; the markup is rebuilt only when this changes
let fadeTimer = null;   // pending switch while the text is faded out

function formatTime(totalSeconds) {
  totalSeconds = Math.max(0, Math.floor(totalSeconds));
  const m = Math.floor(totalSeconds / 60);
  const s = totalSeconds % 60;
  return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = String(str);
  return div.innerHTML;
}

function nowHHMM() {
  return new Date().toLocaleTimeString('en-US', { hour12: true, hour: 'numeric', minute: '2-digit' });
}

async function poll() {
  try {
    live = await Store.getLive();
    fetchedAt = performance.now();
  } catch (e) {}
}

// Blank slides show nothing, so they count as no timer
function displayedTimer() {
  return live && live.timer && live.timer.type !== 'blank' ? live.timer : null;
}

// The markup is only rebuilt when the timer's layout changes; the value and clock are updated in place each frame
function paint(t) {
  const scene = document.getElementById('scene');
  const inner = document.getElementById('scene-inner');

  if (!t) {
    inner.innerHTML = '';
    paintedKey = '';
    return;
  }
  const elapsed = live.elapsed + (live.isRunning ? (performance.now() - fetchedAt) / 1000 : 0);
  const value = formatTime(t.type === 'countup' ? elapsed : Math.max(0, t.duration_seconds - elapsed));

  const key = [t.id, t.name, t.show_title, t.colour, t.size, t.position, t.show_current_time].join('|');
  if (key !== paintedKey) {
    paintedKey = key;
    const alignV = t.position.startsWith('top') ? 'flex-start' : (t.position.startsWith('bottom') ? 'flex-end' : 'center');
    const alignH = t.position.endsWith('left') ? 'flex-start' : (t.position.endsWith('right') ? 'flex-end' : 'center');
    const textAlign = alignH === 'flex-start' ? 'left' : (alignH === 'flex-end' ? 'right' : 'center');

    scene.className = `scene size-${t.size}`;
    inner.style.justifyContent = alignV;
    inner.style.alignItems = alignH;
    inner.style.textAlign = textAlign;
    inner.innerHTML = `
      ${t.show_title ? `<div class="scene-name">${escapeHtml(t.name)}</div>` : ''}
      <div class="scene-value" style="color:${COLOUR_MAP[t.colour] || '#eaeaea'}">${value}</div>
      ${t.show_current_time ? `<div class="scene-clock">${nowHHMM()}</div>` : ''}`;
  } else {
    inner.querySelector('.scene-value').textContent = value;
    const clock = inner.querySelector('.scene-clock');
    if (clock) clock.textContent = nowHHMM();
  }
}

// When the shown timer changes, the text fades out, switches, then fades back in
function render() {
  const inner = document.getElementById('scene-inner');
  const shown = displayedTimer();
  const shownId = shown ? shown.id : null;

  if (shownId !== paintedId && fadeTimer === null) {
    inner.classList.add('is-fading');
    fadeTimer = setTimeout(() => {
      fadeTimer = null;
      const next = displayedTimer();
      paintedId = next ? next.id : null;
      paint(next);
      // Paint while still faded out, then reflow so removing the class fades the new text in
      void inner.offsetWidth;
      inner.classList.remove('is-fading');
    }, LIVE_FADE_MS);
  }
  // During the fade-out the last text is left as it is
  if (fadeTimer === null) paint(shown);
  requestAnimationFrame(render);
}

poll();
setInterval(poll, 100); // frequent polling keeps a mirrored screen within a fraction of a second
requestAnimationFrame(render);

document.addEventListener('click', () => {
  if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {});
});
</script>

</body>
</html>
